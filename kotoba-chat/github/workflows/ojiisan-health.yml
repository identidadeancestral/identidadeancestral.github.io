name: Ojiisan availability

on:
  schedule:
    # UTC, off the top of the hour; gaps are at most three calendar days.
    - cron: '17 10 */3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ojiisan-health.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ojiisan-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check database, account gateway, CORS and production CSP
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          page = 'https://identidadeancestral.github.io/ojiisan-chat/'
          origin = 'https://identidadeancestral.github.io'
          api = 'https://yediixixaxqcwzymhcxf.supabase.co/functions/v1/ojiisan-api'

          def read(url, headers=None):
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers=headers or {})
                      with urllib.request.urlopen(request, timeout=25) as response:
                          return response.read(262144).decode('utf-8'), response.headers
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      time.sleep(2)

          headers = {'Origin': origin, 'Cache-Control': 'no-cache'}
          health, response_headers = read(api + '/health?forceFunctionRegion=sa-east-1', headers)
          value = json.loads(health)
          assert value.get('ok') is True and value.get('backend') == 'supabase', 'Database health failed'
          assert value.get('protocol') == 2, 'Chat sync backend version is not deployed'
          assert response_headers.get('Access-Control-Allow-Origin') == origin, 'API CORS mismatch'
          assert 'retry-after' in response_headers.get('Access-Control-Expose-Headers', '').lower(), 'Browser cannot read API retry delay'
          account, _ = read(api + '/api/account?forceFunctionRegion=sa-east-1', headers)
          assert json.loads(account).get('signedIn') is False, 'Public account gateway failed; check verify_jwt and custom auth'

          class Policy(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta' and attrs.get('http-equiv', '').lower() == 'content-security-policy':
                      self.values.append(attrs.get('content', ''))

          html, _ = read(page, {'Cache-Control': 'no-cache'})
          parser = Policy()
          parser.feed(html)
          assert len(parser.values) == 1, 'Expected one production CSP'
          directives = [d.strip().split() for d in parser.values[0].split(';') if d.strip()]
          connect = [d[1:] for d in directives if d[0] == 'connect-src']
          api_host = urlsplit(api).scheme + '://' + urlsplit(api).netloc
          assert connect == [["'self'", api_host]], 'Production CSP blocks or unnecessarily broadens the API'
          print('PASS database query, public account endpoint, CORS and production CSP')
          PY
